[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "Bouncing-Ball-Task"
version = "0.0.0"
description = "Repo for the bouncing ball task"
authors = [
    { name = "APRashedAhmed" }
]
urls = { "Homepage" = "https://github.com/APRashedAhmed/Bouncing-Ball-Task" }
license = { text = "Not open source" }

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "dataset_generation: marks tests that generate full datasets",
    "controlled_dataset: marks tests specific to controlled dataset generation",
    "variant: marks variant-specific tests",
    "no_change: marks tests specific to no_change variant",
]
